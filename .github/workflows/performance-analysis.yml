name: SEPA Performance Analysis

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: backend
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Download latest screening result and history
        run: |
          test -n "${GCS_BUCKET}" || (echo "GCS_BUCKET is empty." && exit 1)
          mkdir -p data/current-screening data/previous-history
          SCREENING_URI="$(gcloud storage ls --recursive "gs://${GCS_BUCKET}/sepa-screening/**" \
            | grep -E '/sepa_screening_all_[^/]+\.json$' | sort | tail -n 1)"
          test -n "${SCREENING_URI}" || (echo "No full screening JSON found." && exit 1)
          gcloud storage cp "${SCREENING_URI}" data/current-screening/sepa_screening_all_latest.json
          if ! gcloud storage cp "gs://${GCS_BUCKET}/performance-analysis/latest/listing_history.json" \
            data/previous-history/listing_history.json; then
            echo '{"symbols": []}' > data/previous-history/listing_history.json
            echo "No previous listing history found; starting a new history."
          fi
          echo "Latest screening: ${SCREENING_URI}"

      - name: Analyze archived screening performance
        run: |
          python backend/run_performance_analysis.py \
            --screening-file data/current-screening/sepa_screening_all_latest.json \
            --history-file data/previous-history/listing_history.json \
            --output-dir data/performance-analysis

      - name: Verify analysis email input
        run: |
          test -s data/performance-analysis/listing_history.csv
          echo "Analysis CSV ready: $(wc -c < data/performance-analysis/listing_history.csv) bytes"
          test -n "${GMAIL_USERNAME}" || (echo "GMAIL_USERNAME is empty." && exit 1)
          test -n "${GMAIL_APP_PASSWORD}" || (echo "GMAIL_APP_PASSWORD is empty." && exit 1)
          test -n "${REPORT_RECIPIENT}" || (echo "REPORT_RECIPIENT is empty." && exit 1)

      - name: Email analysis CSV report
        run: python -u backend/send_analysis_email.py

      - name: Upload performance analysis to Cloud Storage
        run: |
          ANALYSIS_TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          ANALYSIS_COUNT="$(find data/performance-analysis -maxdepth 1 -type f -name 'performance_*.json' | wc -l)"
          echo "Performance analysis files generated: ${ANALYSIS_COUNT}"
          test "${ANALYSIS_COUNT}" -gt 0 || (echo "No performance analysis files generated." && exit 1)
          gcloud storage cp data/performance-analysis/performance_*.json data/performance-analysis/listing_history.json data/performance-analysis/listing_history.csv \
            "gs://${GCS_BUCKET}/performance-analysis/${ANALYSIS_TIMESTAMP}/"
          gcloud storage cp data/performance-analysis/listing_history.json data/performance-analysis/listing_history.csv \
            "gs://${GCS_BUCKET}/performance-analysis/latest/"
          gcloud storage ls "gs://${GCS_BUCKET}/performance-analysis/${ANALYSIS_TIMESTAMP}/"