name: Nasdaq SEPA Screening

on:
  schedule:
    - cron: "0 21 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_PROVIDER: yahoo
      PYTHONPATH: backend
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Nasdaq screening
        run: python backend/run_live_screening.py --universe --output-dir data/exports

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload reports to Cloud Storage
        run: |
          RUN_TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          gcloud storage cp data/exports/sepa_screening_* "gs://${GCS_BUCKET}/sepa-screening/${RUN_TIMESTAMP}/"

      - name: Email CSV report
        run: python backend/send_screening_email.py