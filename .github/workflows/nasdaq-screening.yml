name: Nasdaq SEPA Screening

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_PROVIDER: yahoo
      PYTHONPATH: backend
      DATABASE_URL: sqlite:///./data/firefinder.db
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check US market holiday
        id: market_day
        shell: bash
        run: |
          MARKET_STATUS="$(python -m app.core.market_calendar)"
          echo "NYSE market status: ${MARKET_STATUS}"
          echo "open=$([[ "${MARKET_STATUS}" == "open" ]] && echo true || echo false)" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud
        if: steps.market_day.outputs.open == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: steps.market_day.outputs.open == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Restore SQLite database
        if: steps.market_day.outputs.open == 'true'
        run: |
          mkdir -p data
          if gcloud storage ls "gs://${GCS_BUCKET}/firefinder-db/latest/firefinder.db" >/dev/null 2>&1; then
            gcloud storage cp "gs://${GCS_BUCKET}/firefinder-db/latest/firefinder.db" data/firefinder.db
            echo "Restored SQLite database from GCS."
          else
            echo "No SQLite database found; starting a new database."
          fi

      - name: Run Nasdaq screening
        if: steps.market_day.outputs.open == 'true'
        run: python backend/run_live_screening.py --universe --output-dir data/exports

      - name: Upload reports to Cloud Storage
        if: steps.market_day.outputs.open == 'true'
        run: |
          test -n "${GCS_BUCKET}" || (echo "GCS_BUCKET is empty. Set it in Settings > Secrets and variables > Actions > Variables." && exit 1)
          echo "Using GCS bucket: ${GCS_BUCKET}"
          RUN_TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "RUN_TIMESTAMP=${RUN_TIMESTAMP}" >> "${GITHUB_ENV}"
          gcloud storage cp data/exports/sepa_screening_* "gs://${GCS_BUCKET}/sepa-screening/${RUN_TIMESTAMP}/"
          gcloud storage cp data/firefinder.db "gs://${GCS_BUCKET}/firefinder-db/${RUN_TIMESTAMP}/firefinder.db"
          gcloud storage cp data/firefinder.db "gs://${GCS_BUCKET}/firefinder-db/latest/firefinder.db"
          gcloud storage ls "gs://${GCS_BUCKET}/sepa-screening/${RUN_TIMESTAMP}/"
# Screening output is retained in Cloud Storage for later analysis.

